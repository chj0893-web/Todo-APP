<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>My Tasks</title>
  <link rel="stylesheet" href="style.css" />
  <!-- 테마 깜빡임 방지: CSS 적용 전에 저장된 테마를 먼저 반영 -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('myTasks.theme');
        if (t !== 'dark' && t !== 'light') {
          t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) { /* ignore */ }
    })();
  </script>
</head>
<body>
  <div class="app">
    <!-- ===== 헤더 ===== -->
    <header class="app-header">
      <div class="header-left">
        <h1 class="app-title">My Tasks</h1>
        <span id="remaining-badge" class="badge-remaining" aria-live="polite">-</span>
      </div>
      <div class="header-right">
        <label class="search-box">
          <span class="sr-only">할 일 검색</span>
          <input type="search" id="search-input" placeholder="할 일 검색..." autocomplete="off" />
        </label>
        <label class="theme-toggle" title="다크/라이트 모드 전환">
          <input type="checkbox" id="theme-toggle" role="switch" aria-label="다크 모드" />
          <span class="theme-toggle-track" aria-hidden="true"><span class="theme-toggle-thumb"></span></span>
          <span class="theme-toggle-label">다크 모드</span>
        </label>
      </div>
    </header>

    <div class="app-body">
      <!-- ===== 사이드바 ===== -->
      <aside class="sidebar">
        <!-- 대시보드 -->
        <section class="panel" aria-labelledby="dashboard-title">
          <h2 id="dashboard-title" class="panel-title">대시보드</h2>
          <div class="stat-overall">
            <div class="stat-row">
              <span class="stat-label">전체 진행률</span>
              <strong id="progress-text" class="stat-value">불러오는 중...</strong>
            </div>
            <div class="progress-track">
              <div id="progress-bar" class="progress-fill" role="progressbar"
                   aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div>
            </div>
          </div>
          <ul class="stat-categories">
            <li class="stat-cat" style="--cat-color: #4A90E2">
              <div class="stat-row">
                <span class="stat-label"><i class="dot"></i>업무</span>
                <span class="stat-value" data-stat="work">0/0</span>
              </div>
              <div class="mini-track"><div class="mini-fill" data-bar="work"></div></div>
            </li>
            <li class="stat-cat" style="--cat-color: #27AE60">
              <div class="stat-row">
                <span class="stat-label"><i class="dot"></i>개인</span>
                <span class="stat-value" data-stat="personal">0/0</span>
              </div>
              <div class="mini-track"><div class="mini-fill" data-bar="personal"></div></div>
            </li>
            <li class="stat-cat" style="--cat-color: #8E44AD">
              <div class="stat-row">
                <span class="stat-label"><i class="dot"></i>공부</span>
                <span class="stat-value" data-stat="study">0/0</span>
              </div>
              <div class="mini-track"><div class="mini-fill" data-bar="study"></div></div>
            </li>
          </ul>
          <div class="stat-today">
            <span class="stat-label">오늘 추가</span>
            <strong id="today-count" class="stat-value stat-today-value">0개</strong>
          </div>
        </section>

        <!-- 필터 -->
        <section class="panel" aria-labelledby="filter-title">
          <h2 id="filter-title" class="panel-title">필터</h2>
          <div id="filter-group" class="filter-group" role="group" aria-label="카테고리 필터">
            <button type="button" class="filter-btn is-active" data-filter="all" aria-pressed="true">
              <span class="filter-name">전체</span>
              <span class="filter-count" data-count="all">0</span>
              <kbd>Alt+1</kbd>
            </button>
            <button type="button" class="filter-btn" data-filter="work" aria-pressed="false" style="--cat-color: #4A90E2">
              <span class="filter-name"><i class="dot"></i>업무</span>
              <span class="filter-count" data-count="work">0</span>
              <kbd>Alt+2</kbd>
            </button>
            <button type="button" class="filter-btn" data-filter="personal" aria-pressed="false" style="--cat-color: #27AE60">
              <span class="filter-name"><i class="dot"></i>개인</span>
              <span class="filter-count" data-count="personal">0</span>
              <kbd>Alt+3</kbd>
            </button>
            <button type="button" class="filter-btn" data-filter="study" aria-pressed="false" style="--cat-color: #8E44AD">
              <span class="filter-name"><i class="dot"></i>공부</span>
              <span class="filter-count" data-count="study">0</span>
              <kbd>Alt+4</kbd>
            </button>
          </div>
        </section>

        <!-- 데이터 관리 -->
        <section class="panel" aria-labelledby="data-title">
          <h2 id="data-title" class="panel-title">데이터 관리</h2>
          <div class="data-actions">
            <button type="button" id="export-btn" class="btn btn-ghost">내보내기 (JSON)</button>
            <button type="button" id="import-btn" class="btn btn-ghost">가져오기</button>
            <input type="file" id="import-file" accept="application/json,.json" hidden />
            <button type="button" id="clear-completed-btn" class="btn btn-danger-ghost">완료된 항목 모두 삭제</button>
          </div>
          <p class="panel-note">JSON 파일로 백업하고 다른 브라우저에서 복원할 수 있습니다.</p>
        </section>
      </aside>

      <!-- ===== 메인 ===== -->
      <main class="main">
        <section class="panel add-panel" aria-label="할 일 추가">
          <form id="todo-form" class="todo-form" autocomplete="off">
            <select id="category-select" class="category-select" aria-label="카테고리">
              <option value="work">업무</option>
              <option value="personal">개인</option>
              <option value="study">공부</option>
            </select>
            <input type="text" id="todo-input" class="todo-input"
                   placeholder="새로운 할 일을 입력하세요... (Alt+N)"
                   maxlength="200" required aria-label="새로운 할 일" />
            <button type="submit" class="btn btn-primary">추가</button>
          </form>
          <p id="auto-category-hint" class="auto-hint" hidden></p>
          <div class="toolbar">
            <label class="sort-box">
              <span>정렬</span>
              <select id="sort-select" aria-label="정렬 방식">
                <option value="newest">최신순</option>
                <option value="oldest">오래된순</option>
                <option value="category">카테고리순</option>
                <option value="status">완료 상태순</option>
                <option value="manual">수동 정렬</option>
              </select>
            </label>
            <span id="drag-hint" class="drag-hint"></span>
          </div>
        </section>

        <section class="panel list-panel" aria-label="할 일 목록">
          <ul id="todo-list" class="todo-list"></ul>
          <p id="empty-message" class="empty-message" hidden>할 일이 없습니다. 추가해보세요!</p>
        </section>
      </main>
    </div>
  </div>

  <!-- 할 일 항목 템플릿 -->
  <template id="todo-item-template">
    <li class="todo-item" draggable="true">
      <span class="drag-handle" aria-hidden="true" title="드래그하여 순서 변경">⋮⋮</span>
      <input type="checkbox" class="todo-check" aria-label="완료" />
      <div class="todo-body">
        <span class="todo-text" title="더블클릭하여 수정"></span>
        <div class="todo-meta">
          <span class="todo-tag"></span>
          <time class="todo-time"></time>
        </div>
      </div>
      <button type="button" class="btn-delete" aria-label="삭제" title="삭제">×</button>
    </li>
  </template>

  <script src="script.js"></script>
</body>
</html>
